<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hutan Kita — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #16201A;
    --canopy: #1F3A2E;
    --canopy-light: #2F5240;
    --canopy-soft: #E3E8DC;
    --soil: #6B4226;
    --soil-light: #8C5A34;
    --soil-soft: #EDE2D4;
    --amber: #D9A441;
    --amber-dark: #AD7B26;
    --alert: #C0432B;
    --paper: #F1EFE4;
    --card: #F9F8F1;
    --line: #DAD6C6;
    --sub: #5B6459;
    --f-display: 'Fraunces', serif;
    --f-body: 'IBM Plex Sans', sans-serif;
    --f-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--f-body); color: var(--ink); background: var(--paper); }
  .icon { display: inline-block; vertical-align: middle; }
  button { font-family: inherit; cursor: pointer; border: none; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 12px 16px; }

  /* topbar */
  .topbar { background: var(--ink); display: flex; align-items: center; gap: 4px; padding: 10px 16px; overflow-x: auto; }
  .topbar-label { color: rgba(255,255,255,0.55); font-size: 12px; margin-right: 10px; white-space: nowrap; }
  .topbar-tab { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px; background: transparent; color: rgba(255,255,255,0.75); font-size: 13px; white-space: nowrap; }
  .topbar-tab.active { background: var(--amber); color: var(--ink); }

  /* pills */
  .pill { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; display: inline-block; }
  .pill-canopy { background: var(--canopy-soft); color: var(--canopy); }
  .pill-amber { background: #F5E6C6; color: var(--amber-dark); }
  .pill-alert { background: #F4DCD5; color: var(--alert); }
  .pill-soil { background: var(--soil-soft); color: var(--soil); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .btn { font-size: 14px; padding: 10px 18px; border-radius: 8px; }
  .btn-canopy { background: var(--canopy); color: #fff; }
  .btn-amber { background: var(--amber); color: var(--ink); font-weight: 500; }
  .btn-outline { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn-soil { background: var(--soil); color: #fff; }

  /* ===== Landing ===== */
  .landing-header { display: flex; align-items: center; justify-content: space-between; padding: 24px 56px; border-bottom: 1px solid var(--line); }
  .logo { font-family: var(--f-display); font-size: 24px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .landing-nav { display: flex; gap: 32px; font-size: 15px; color: var(--sub); }
  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 64px 56px; align-items: center; }
  .hero-eyebrow { color: var(--amber-dark); font-size: 14px; margin-bottom: 16px; }
  .hero h1 { font-family: var(--f-display); font-size: 52px; line-height: 1.08; font-weight: 500; margin: 0 0 24px; }
  .hero p { color: var(--sub); font-size: 17px; max-width: 480px; margin: 0 0 32px; }
  .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .dossier-card { width: 320px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px; transform: rotate(1.5deg); font-family: var(--f-mono); box-shadow: 0 18px 40px -20px rgba(22,32,26,0.35); margin: 0 auto; }
  .dossier-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .dossier-label { font-size: 11px; color: var(--sub); }
  .dossier-id { font-family: var(--f-display); font-size: 20px; margin-bottom: 4px; }
  .dossier-loc { font-size: 13px; color: var(--sub); margin-bottom: 20px; }
  .dossier-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: 13px; }
  .dossier-grid .lab { color: var(--sub); margin-bottom: 4px; }

  .stats-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); padding: 0 56px; }
  .stat-cell { background: var(--paper); padding: 24px; }
  .stat-num { font-family: var(--f-display); font-size: 28px; color: var(--canopy); margin-bottom: 4px; }
  .stat-lab { font-size: 13px; color: var(--sub); }

  .section { padding: 64px 56px; }
  .section h2 { font-family: var(--f-display); font-size: 28px; margin: 0 0 8px; }
  .section .lead { color: var(--sub); font-size: 15px; max-width: 520px; margin: 0 0 32px; }

  .layers-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .layer-card { padding: 20px; }
  .layer-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; color: var(--canopy); }
  .layer-num { font-size: 12px; color: var(--sub); }
  .layer-title { font-family: var(--f-display); font-size: 17px; margin-bottom: 8px; }
  .layer-desc { font-size: 13px; color: var(--sub); }

  .projects-section { background: var(--canopy-soft); }
  .projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .project-card { padding: 20px; }
  .project-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .project-id { font-family: var(--f-mono); font-size: 12px; color: var(--sub); }
  .project-loc { font-family: var(--f-display); font-size: 19px; margin-bottom: 16px; }
  .project-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--sub); }

  .marketplace-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .mkt-card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .mkt-img { background: var(--soil-soft); height: 90px; display: flex; align-items: center; justify-content: center; color: var(--soil); }
  .mkt-body { padding: 16px; }
  .mkt-name { font-size: 14px; margin-bottom: 4px; }
  .mkt-price { font-size: 13px; color: var(--amber-dark); margin-bottom: 8px; }
  .mkt-by { font-size: 12px; color: var(--sub); }

  .landing-footer { padding: 32px 56px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 13px; color: var(--sub); }

  /* ===== Dashboard ===== */
  .dash-wrap { display: flex; min-height: 720px; }
  .dash-sidebar { width: 240px; flex-shrink: 0; background: var(--canopy); padding: 20px; color: #fff; display: flex; flex-direction: column; }
  .dash-logo { font-family: var(--f-display); font-size: 20px; margin-bottom: 32px; display: flex; align-items: center; gap: 8px; }
  .dash-nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 6px; font-size: 14px; margin-bottom: 2px; }
  .dash-nav-item.active { background: rgba(255,255,255,0.12); }
  .dash-user { margin-top: auto; padding-top: 24px; font-size: 12px; color: rgba(255,255,255,0.65); }
  .dash-main { flex: 1; padding: 32px; }
  .dash-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; }
  .dash-title { font-family: var(--f-display); font-size: 24px; }
  .dash-sub { font-size: 13px; color: var(--sub); }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .kpi-card { padding: 16px; }
  .kpi-icon { color: var(--canopy); margin-bottom: 12px; }
  .kpi-val { font-family: var(--f-display); font-size: 22px; }
  .kpi-lab { font-size: 12px; color: var(--sub); }
  .dash-row { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 24px; }
  .panel { padding: 20px; }
  .panel-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; font-weight: 500; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--sub); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .grid-cells { display: grid; grid-template-columns: repeat(15, 1fr); gap: 6px; }
  .grid-cells div { aspect-ratio: 1/1; border-radius: 3px; }
  .fire-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; color: var(--amber-dark); }
  .fire-score { font-size: 13px; color: var(--ink); margin-bottom: 4px; }
  .sensor-row { font-size: 13px; color: var(--sub); display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .activity-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .activity-row:first-child { border-top: none; }
  .activity-left { display: flex; align-items: center; gap: 12px; color: var(--sub); }
  .activity-left b { color: var(--ink); font-weight: 500; }
  .activity-right { display: flex; align-items: center; gap: 12px; }

  /* ===== Mobile ===== */
  .mobile-wrap { display: flex; justify-content: center; padding: 40px 16px; }
  .phone { background: var(--ink); border-radius: 40px; padding: 12px; width: 340px; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5); }
  .phone-screen { background: var(--soil-soft); border-radius: 30px; height: 640px; overflow: hidden; display: flex; flex-direction: column; }
  .fk-header { background: var(--soil); color: #fff; padding: 32px 20px 20px; }
  .fk-header .role { font-size: 12px; opacity: 0.8; }
  .fk-header .name { font-family: var(--f-display); font-size: 18px; }
  .fk-body { padding: 20px; flex: 1; }
  .fk-sub { font-size: 13px; color: var(--sub); margin-bottom: 12px; }
  .task-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .task-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .task-title { font-size: 15px; font-weight: 500; }
  .task-meta { font-size: 12px; color: var(--sub); margin-bottom: 12px; }
  .task-card.dim { opacity: 0.7; }
  .fk-tabbar { border-top: 1px solid var(--line); background: #fff; display: flex; justify-content: space-around; padding: 12px 0; }
  .fk-tabbar div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: var(--sub); }
  .fk-tabbar div.on { color: var(--soil); }

  .flow-wrap { flex: 1; display: flex; flex-direction: column; padding: 20px; }
  .flow-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .flow-top button { background: none; color: var(--soil); }
  .flow-step-count { font-size: 12px; color: var(--sub); }
  .flow-progress { display: flex; gap: 6px; margin-bottom: 24px; }
  .flow-progress div { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .flow-progress div.on { background: var(--soil); }
  .flow-icon { background: var(--soil); border-radius: 999px; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; color: #fff; }
  .flow-title { font-family: var(--f-display); font-size: 20px; margin-bottom: 8px; }
  .flow-desc { font-size: 14px; color: var(--sub); margin-bottom: 24px; }
  .qr-box { border: 1px dashed var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 16px; background: #fff; color: var(--soil); }
  .qr-box.done { background: var(--canopy-soft); color: var(--canopy); }
  .qr-box span { font-size: 13px; color: var(--ink); }
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .photo-cell { border: 1px dashed var(--line); border-radius: 10px; aspect-ratio: 3/4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #fff; color: var(--soil); }
  .photo-cell.done { background: var(--canopy-soft); color: var(--canopy); }
  .photo-cell span { font-size: 10px; color: var(--sub); }
  .flow-next { margin-top: auto; }
  .flow-next button { width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; }
  .flow-next button.enabled { background: var(--soil); }
  .flow-next button.disabled { background: var(--line); color: #fff; cursor: not-allowed; }

  .done-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .done-icon { background: var(--canopy-soft); border-radius: 999px; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; color: var(--canopy); }
  .done-title { font-family: var(--f-display); font-size: 19px; margin-bottom: 8px; }
  .done-desc { font-size: 13px; color: var(--sub); margin-bottom: 24px; }
  .done-wallet { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 20px; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; color: var(--amber-dark); font-size: 14px; }

  /* ===== Admin ===== */
  .admin-wrap { padding: 32px; min-height: 720px; }
  .admin-title { font-family: var(--f-display); font-size: 24px; margin-bottom: 4px; }
  .admin-sub { font-size: 13px; color: var(--sub); margin-bottom: 24px; }
  .admin-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
  .admin-tabs button { padding: 8px 16px; border-radius: 6px; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .admin-tabs button.active { background: var(--canopy); color: #fff; }
  .admin-table-wrap { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
  .admin-table-wrap thead { background: var(--canopy-soft); }
  .admin-table-wrap.payroll thead { background: var(--soil-soft); }
  .admin-table-wrap tbody tr { border-top: 1px solid var(--line); }
  .mono { font-family: var(--f-mono); }
  .sdm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .sdm-panel { padding: 20px; }
  .sdm-panel-title { font-size: 14px; font-weight: 500; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .sdm-role { padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 8px; }
  .sdm-role.hq { background: var(--canopy-soft); }
  .sdm-role.field { background: var(--soil-soft); }

  @media (max-width: 860px) {
    .hero, .dash-row, .sdm-grid { grid-template-columns: 1fr; }
    .stats-strip, .layers-grid, .projects-grid { grid-template-columns: repeat(2, 1fr); }
    .marketplace-grid { grid-template-columns: repeat(2, 1fr); }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .landing-nav { display: none; }
    .landing-header, .section, .hero { padding-left: 24px; padding-right: 24px; }
    .dash-wrap { flex-direction: column; }
    .dash-sidebar { width: 100%; }
  }
</style>
</head>

<script>

/* ---------------- Data ---------------- */
const formatRp = (n) => "Rp " + n.toLocaleString("id-ID");

function pill(text, tone = "canopy") {
  return `<span class="pill pill-${tone}">${text}</span>`;
}
const statusTone = {
  Candidate: "soil", Screening: "amber", Verified: "amber",
  "Ready for Funding": "amber", Active: "canopy", Completed: "canopy",
};

  { name: "Madu Hutan", price: "Rp 120.000 / 350ml", by: "Kelompok Tani Jambi" },
  { name: "Vanila Kering", price: "Rp 45.000 / 20g", by: "Forest Keeper Klaster 2" },
  { name: "Anyaman Bambu", price: "Rp 65.000 / pcs", by: "KUPS Ketapang" },
];

const survivalData = [58, 63, 67, 71, 74, 77, 79, 80, 81, 82, 83, 84].map((rate, i) => ({ m: `B${i + 1}`, rate }));

const activityFeed = [
  { fk: "Yanto S. (FK-0231)", action: "Penanaman", tree: "HTK-2026-00452", time: "09:12", status: "Terverifikasi" },
  { fk: "Rina W. (FK-0198)", action: "Penyiangan", tree: "HTK-2026-00311", time: "08:47", status: "Terverifikasi" },
  { fk: "Budi K. (FK-0304)", action: "Pemupukan", tree: "HTK-2026-00289", time: "08:20", status: "Menunggu QC" },
  { fk: "Sari M. (FK-0177)", action: "Penyulaman", tree: "HTK-2026-00145", time: "07:55", status: "Terverifikasi" },

const fkPayroll = [
  { name: "Yanto S.", id: "FK-0231", tanam: 180, siang: 60, pupuk: 40, bonus: true },
  { name: "Rina W.", id: "FK-0198", tanam: 210, siang: 45, pupuk: 30, bonus: true },
  { name: "Budi K.", id: "FK-0304", tanam: 140, siang: 70, pupuk: 55, bonus: false },

/* ---------------- Chart helper (SVG area chart) ---------------- */
function areaChartSVG(data, { width = 640, height = 180, min = 40, max = 100 } = {}) {
  const stepX = width / (data.length - 1);
  const scaleY = (v) => height - ((v - min) / (max - min)) * height;
  const pts = data.map((d, i) => [i * stepX, scaleY(d.rate)]);
  const line = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const area = `${line} L${width},${height} L0,${height} Z`;
  const labels = data.map((d, i) => `<text x="${(i * stepX).toFixed(1)}" y="${height + 16}" font-size="10" fill="var(--sub)" text-anchor="middle">${d.m}</text>`).join("");
  const dots = pts.map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="var(--canopy)" />`).join("");
  return `
    <svg viewBox="0 0 ${width} ${height + 24}" width="100%" style="overflow:visible">
      <defs>
        <linearGradient id="srGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--canopy)" stop-opacity="0.35" />
          <stop offset="100%" stop-color="var(--canopy)" stop-opacity="0" />
        </linearGradient>
      </defs>
      <path d="${area}" fill="url(#srGrad)" />
      <path d="${line}" fill="none" stroke="var(--canopy)" stroke-width="2" />
      ${dots}
      ${labels}
    </svg>`;
}

/* ---------------- Root render + events ---------------- */
function render() {
  renderTopbar();
  const root = document.getElementById("view-root");
  if (state.view === "landing") root.innerHTML = renderLanding();
  else if (state.view === "dashboard") root.innerHTML = renderDashboard();
  else if (state.view === "mobile") root.innerHTML = renderMobile();
  else if (state.view === "admin") root.innerHTML = renderAdmin();
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "set-view") state.view = el.dataset.view;
  else if (action === "mobile-start") { state.mobile.screen = "flow"; state.mobile.step = 0; }
  else if (action === "mobile-back") {
    if (state.mobile.step === 0) state.mobile.screen = "tasks";
    else state.mobile.step -= 1;
  }
  else if (action === "mobile-scan") state.mobile.scanned = true;
  else if (action === "mobile-photo") state.mobile.photos[Number(el.dataset.idx)] = true;
  else if (action === "mobile-next") {
    if (state.mobile.step === 7) state.mobile.screen = "done";
    else state.mobile.step += 1;
  }
  else if (action === "mobile-reset") {
    state.mobile = { screen: "tasks", step: 0, scanned: false, photos: [false, false, false] };
  }
  else if (action === "admin-tab") state.admin.tab = el.dataset.tab;

  render();
});

render();
